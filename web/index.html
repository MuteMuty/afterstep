<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Afterstep: a daily puzzle where your past self holds the doors</title>
    <meta name="description" content="A new puzzle every day. A few moves behind you, an echo repeats everything you did. Use it to hold doors open." />
    <meta name="theme-color" content="#123566" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e6edf4" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="Afterstep" />
    <meta property="og:description" content="A daily puzzle where your past self holds the doors." />
    <meta property="og:url" content="https://afterstep.brightloopapps.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/" aria-label="Afterstep, today's puzzle">Afterstep</a>
      <nav aria-label="Main">
        <button data-nav="today" aria-current="page">Today</button>
        <button data-nav="learn">How to play</button>
        <button data-nav="archive">Past puzzles</button>
      </nav>
    </header>

    <main>
      <section class="play" aria-labelledby="level-title">
        <div class="level-head">
          <h1 id="level-title">Loading</h1>
          <p id="level-sub" class="sub"></p>
        </div>
        <p id="tip" class="tip" hidden></p>

        <div class="board-wrap">
          <div id="board" class="board" role="application" aria-label="Puzzle board. Arrow keys move, Space waits, Z undoes, H shows a hint."></div>
        </div>

        <div class="status-row">
          <div class="status" aria-live="polite">
            <span id="echo-status"></span>
            <span id="moves"></span>
            <span id="hint-note" class="hint-note" hidden></span>
            <span id="board-news" class="sr-only"></span>
          </div>
          <div id="solved" class="solved">
            <p id="solved-text" class="solved-text" role="status"></p>
          </div>
        </div>

        <div class="controls">
          <button id="undo" title="Undo (Z)">Undo</button>
          <button id="wait" class="primary" title="Wait a turn (Space)">Wait</button>
          <button id="restart" title="Start over (R)">Start over</button>
          <button id="hint" title="Show a hint (H)">Hint</button>
        </div>
        <div class="below">
          <div id="solved-actions" class="win-actions solved-actions" hidden>
            <button id="solved-share" class="primary">Copy result</button>
            <button id="solved-next">Next</button>
          </div>
          <div class="dpad" aria-label="Move">
            <button data-move="0" aria-label="Up">▲</button>
            <button data-move="2" aria-label="Left">◀</button>
            <button data-move="1" aria-label="Down">▼</button>
            <button data-move="3" aria-label="Right">▶</button>
          </div>
          <p class="keys"><span class="keys-half"><span>Arrows or WASD move</span> · <span>Space waits</span></span><span class="keys-join"> · </span><span class="keys-half"><span>Z undoes</span> · <span>R starts over</span> · <span>H hints</span></span></p>
        </div>
      </section>

      <section id="archive" class="archive" hidden aria-labelledby="archive-title">
        <h1 id="archive-title">Past puzzles</h1>
        <ol id="archive-list"></ol>
      </section>
    </main>

    <dialog id="win">
      <h2 id="win-title">Solved</h2>
      <p id="win-body"></p>
      <div class="win-actions">
        <button id="share" class="primary">Copy result</button>
        <button id="next">Next</button>
      </div>
      <!-- Likes (lab#17): hidden until the lab's like counts load. -->
      <p id="win-like" class="win-like" hidden>
        <span id="win-like-ask">Enjoyed today's puzzle?</span>
        <button id="like-win" class="like" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20s-7.5-4.6-7.5-10.1A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg><span class="like-n" aria-hidden="true"></span></button>
      </p>
      <p class="like-note win-like-note" aria-hidden="true" hidden></p>
    </dialog>

    <footer class="foot">
      <p><button id="like-foot" class="like" type="button" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20s-7.5-4.6-7.5-10.1A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg><span class="like-n" aria-hidden="true"></span></button> A new puzzle every day. Made by <a href="https://github.com/MuteMuty">Erik Pahor</a> at <a href="https://lab.brightloopapps.com">BrightLoop Lab</a>. <a href="https://github.com/MuteMuty/afterstep">Source</a></p>
      <p class="like-note foot-like-note" aria-hidden="true" hidden></p>
      <p id="like-live" class="sr-only" role="status"></p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
